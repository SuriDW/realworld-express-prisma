<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Sharing System</title>
  <link rel="stylesheet" href="/styles/effects.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1, h2, h3 {
      color: #5cb85c;
    }
    
    .container {
      margin-bottom: 30px;
    }
    
    .link-card {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 20px;
      background-color: #fff;
    }
    
    .link-filter-form {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    
    .search-input, .type-select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      flex: 1;
    }
    
    .button {
      background-color: #5cb85c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    
    .type-badge {
      display: inline-block;
      background-color: #f0ad4e;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 10px;
    }
    
    .meta {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
    }
    
    .create-link-form {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .form-group textarea {
      min-height: 100px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Link Sharing System</h1>
    <p>Share and discover quality learning resources</p>
  </header>
  
  <main>
    <section class="container">
      <h2>Create New Link</h2>
      <form id="create-link-form" class="create-link-form">
        <div class="form-group">
          <label for="link-title">Title</label>
          <input type="text" id="link-title" required>
        </div>
        <div class="form-group">
          <label for="link-overview">Overview</label>
          <textarea id="link-overview" required></textarea>
        </div>
        <div class="form-group">
          <label for="link-url">URL</label>
          <input type="url" id="link-url" required>
        </div>
        <div class="form-group">
          <label for="link-type">Type</label>
          <select id="link-type" required>
            <option value="">Select a type</option>
            <option value="article">Article</option>
            <option value="video">Video</option>
            <option value="course">Course</option>
            <option value="tool">Tool</option>
          </select>
        </div>
        <button type="submit" class="button">Submit Link</button>
      </form>
    </section>
    
    <section class="container">
      <h2>Find Links</h2>
      <div id="link-filter-container"></div>
    </section>
    
    <section class="container">
      <h2>Available Links</h2>
      <div id="link-list-container"></div>
    </section>
  </main>
  
  <script src="/js/linkComponents.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize link UI components
      window.LinkComponents.initLinkUI();
      
      // Setup create link form
      const createLinkForm = document.getElementById('create-link-form');
      
      createLinkForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const linkData = {
          title: document.getElementById('link-title').value,
          overview: document.getElementById('link-overview').value,
          url: document.getElementById('link-url').value,
          type: document.getElementById('link-type').value
        };
        
        try {
          const newLink = await window.LinkComponents.LinkService.createLink(linkData);
          alert('Link created successfully!');
          createLinkForm.reset();
          
          // Refresh the link list
          const links = await window.LinkComponents.LinkService.getLinks();
          window.LinkComponents.renderLinkList(links, document.getElementById('link-list-container'));
        } catch (error) {
          console.error('Error creating link:', error);
          alert('Error creating link. Please make sure you are logged in and try again.');
        }
      });
    });
  </script>
</body>
</html>
